name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type check, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint
      - run: npx vitest run
      - run: npx next build
